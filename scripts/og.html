<!doctype html>
<!-- Source for public/og.png. Regenerate with: pnpm run og -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; background: #000; overflow: hidden; }
      body {
        position: relative;
        font-family: -apple-system, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
        color: #fff;
      }
      /* Frame lines that run off the canvas, like a blueprint grid. */
      .line { position: absolute; background: #3a3a3a; }
      .v { top: 0; bottom: 0; width: 1px; }
      .h { left: 0; right: 0; height: 1px; }
      .brand {
        position: absolute; left: 130px; top: 104px;
        display: flex; align-items: center; gap: 14px;
        font-size: 30px; font-weight: 600; letter-spacing: -0.5px;
      }
      .brand img { width: 40px; height: 40px; }
      .content { position: absolute; left: 130px; top: 200px; }
      h1 { font-size: 84px; font-weight: 700; letter-spacing: -2.5px; line-height: 1; }
      p {
        margin-top: 44px;
        max-width: 620px;
        font-size: 36px;
        line-height: 1.6;
        color: #a3a3a3;
        letter-spacing: 0.2px;
      }
      /* Mark: the app's latency scale, fast → slow. */
      .mark { position: absolute; right: 102px; bottom: 102px; display: grid; grid-template-columns: repeat(2, 16px); gap: 6px; }
      .mark span { width: 16px; height: 16px; border-radius: 3px; }
      .codes {
        position: absolute; left: 130px; bottom: 100px;
        font: 22px ui-monospace, "SF Mono", Menlo, monospace; color: #6b6b6b; letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div class="line v" style="left: 64px"></div>
    <div class="line v" style="left: 1135px"></div>
    <div class="line h" style="top: 64px"></div>
    <div class="line h" style="top: 565px"></div>

    <div class="brand"><img src="../public/convex.svg" alt="" />Convex</div>

    <div class="content">
      <h1>Region Latency</h1>
      <p>How fast a Convex write shows up in four regions, live.</p>
    </div>

    <div class="codes">iad · dub · syd · yul</div>

    <div class="mark" aria-hidden="true">
      <span style="background: #34d399"></span>
      <span style="background: #bef264"></span>
      <span style="background: #fbbf24"></span>
      <span style="background: #f43f5e"></span>
    </div>
  </body>
</html>
